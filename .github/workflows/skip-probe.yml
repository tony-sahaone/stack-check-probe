name: skip probe

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  guard:
    name: skip-check
    runs-on: ubuntu-latest
    steps:
      - name: Marker from the S2 head
        run: |
          echo "COPY=HEAD-S2"
          echo "pr=${{ github.event.pull_request.number }}"
          echo "base=${{ github.event.pull_request.base.ref }}"
          echo "event=${{ github.event_name }}"
